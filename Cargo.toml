[package]
name = "transaction-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database (PostgreSQL only - no MySQL to avoid rsa vulnerability)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }

# Async runtime
tokio-util = "0.7"
async-trait = "0.1"

# UUID support
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Password hashing
bcrypt = "0.15"

# HTTP client for webhooks
reqwest = { version = "0.11", features = ["json"] }

# Environment configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
tracing-opentelemetry = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Validation
validator = { version = "0.20", features = ["derive"] }

# HMAC for webhook signatures
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Random generation
rand = "0.8"
base64 = "0.21"

# Rate limiting
governor = "0.6"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.13"

[dev-dependencies]
# Testing
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "transaction-service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
